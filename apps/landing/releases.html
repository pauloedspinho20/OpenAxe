<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "OpenAxe Releases",
        "description": "Every OpenAxe desktop and plugin release.",
        "url": "https://openaxe-site.pages.dev/releases.html",

          "name": "OpenAxe",

        }

  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" role="banner">
      <div class="container">
        <a class="brand" href="/" aria-label="OpenAxe home">
          <img src="/icons/openaxe-32.png" alt="" width="28" height="28" aria-hidden="true" />
          OPEN<span>AXE</span> <span class="ox-badge ox-badge-accent" aria-label="beta">BETA</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a href="/">Home</a>
          <a href="/releases.html" aria-current="page">Releases</a>

            ☾ Carbon
          </button>
        </nav>
      </div>
    </header>
    <main id="main" class="section">
      <div class="container">
        <h1 style="font-family: var(--font-display); font-size: 28px; margin: 0 0 var(--sp-2)">

          <a data-web-app href="https://openaxe.pages.dev" rel="noopener">openaxe.pages.dev</a> — no

        </p>

          <p class="muted">Loading releases…</p>
          <noscript><p>Enable JavaScript to see the release list.</p></noscript>
        </div>
      </div>
    </main>
    <footer class="site-footer" role="contentinfo">

        <div>© <span id="footer-year">2026</span> OpenAxe</div>
        <div class="footer-links">
