# Release (Linux leg) — tag push v* → guard → deb + plugin bundles → R2.

labels:
  platform: linux/amd64

when:
  - event: tag
    ref: refs/tags/v*

steps:
  guard:
    image: openaxe-ci-linux:latest
    commands:
      - node -e "var t=(process.env.CI_COMMIT_TAG||'').replace(/^v/,'');var v=require('fs').readFileSync('VERSION','utf8').trim();if(t!==v){console.error('tag '+process.env.CI_COMMIT_TAG+' != VERSION '+v);process.exit(1)}"
  setup:
    image: openaxe-ci-linux:latest
    commands:
      - node scripts/ci-local.mjs --stage=setup
  desktop:
    image: openaxe-ci-linux:latest
    commands:
      - pnpm --filter @openaxe/desktop package
  plugin:
    image: openaxe-ci-linux:latest
    commands:
      - node scripts/ci-local.mjs --stage=plugin --skip-setup
      # Linux plugin bundles are headless (no IGraphics backend / SDKs) —
      # allow-empty so the absence doesn't fail the release; the deb is the
      # Linux artifact (see r2-publish.mjs).
      - node scripts/collect-plugin-bundles.mjs --platform=linux --allow-empty
  upload:
    image: openaxe-ci-linux:latest
    secrets: [r2_access_key, r2_secret_key, r2_account_id]
    environment:
      R2_PUBLIC_URL: https://pub-800f414cbfe9422e9faaa00ed34d2821.r2.dev
    commands:
      - node scripts/r2-upload.mjs "apps/desktop/build/openaxe-desktop-*.deb"
