# Linux CI — runs on the Docker agent using the existing openaxe-ci-linux image
# (docker/ci-linux/Dockerfile, ubuntu-24.04, matches GitHub ubuntu-24.04 legs).
# e2e is mac-only for now: Playwright browsers install at container-run time
# (see docker/ci-linux/run-linux-ci.sh) and would re-download every step here.

labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]
    branch: [dev, main]

steps:
  setup:
    image: openaxe-ci-linux:latest
    commands:
      - node scripts/ci-local.mjs --stage=setup
  drift:
    image: openaxe-ci-linux:latest
    commands:
      - node scripts/ci-local.mjs --stage=drift --skip-setup
  lint:
    image: openaxe-ci-linux:latest
    commands:
      - node scripts/ci-local.mjs --stage=lint --skip-setup
  build:
    image: openaxe-ci-linux:latest
    commands:
      - node scripts/ci-local.mjs --stage=build --skip-setup
  unit:
    image: openaxe-ci-linux:latest
    commands:
      - node scripts/ci-local.mjs --stage=unit --skip-setup
  core:
    image: openaxe-ci-linux:latest
    commands:
      - node scripts/ci-local.mjs --stage=core --skip-setup
  desktop:
    image: openaxe-ci-linux:latest
    commands:
      - node scripts/ci-local.mjs --stage=desktop --skip-setup
  plugin:
    image: openaxe-ci-linux:latest
    commands:
      - node scripts/ci-local.mjs --stage=plugin --skip-setup
