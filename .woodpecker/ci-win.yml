# Windows CI — runs on the UTM Windows 11 ARM VM agent (Local backend).
# PROVISIONAL subset: pure-JS stages + core (CMake/VS Build Tools) first.
# desktop/plugin legs get added once this file is green (issue #427 Phase 4).
# Requires on the VM: git, Node 22, pnpm 10.16.1, CMake, VS Build Tools.
# NOTE: `image` selects the shell for the Local backend (powershell on Win11).

labels:
  platform: windows/arm64

when:
  - event: [push, pull_request, manual]
    branch: [dev, main, feat/427-woodpecker-ci]

steps:
  setup:
    image: powershell
    commands:
      - node scripts/ci-local.mjs --stage=setup
  drift:
    image: powershell
    commands:
      - node scripts/ci-local.mjs --stage=drift --skip-setup
  lint:
    image: powershell
    commands:
      - node scripts/ci-local.mjs --stage=lint --skip-setup
  build:
    image: powershell
    commands:
      - node scripts/ci-local.mjs --stage=build --skip-setup
  unit:
    image: powershell
    commands:
      - node scripts/ci-local.mjs --stage=unit --skip-setup
  core:
    image: powershell
    commands:
      - node scripts/ci-local.mjs --stage=core --skip-setup
