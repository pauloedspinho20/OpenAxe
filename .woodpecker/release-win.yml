# Release (Windows leg) — tag push v* → guard → zip + plugin bundles → R2.
# Runs on the UTM Win11 ARM agent (powershell shell). Prereqs on the VM:
# git, Node 22, pnpm 10.16.1, CMake, VS Build Tools, rclone.
# NOTE: `image` selects the shell for the Local backend (powershell on Win11).

labels:
  platform: windows/arm64

when:
  - event: tag
    ref: refs/tags/v*

steps:
  guard:
    image: powershell
    commands:
      - node -e "var t=(process.env.CI_COMMIT_TAG||'').replace(/^v/,'');var v=require('fs').readFileSync('VERSION','utf8').trim();if(t!==v){console.error('tag '+process.env.CI_COMMIT_TAG+' != VERSION '+v);process.exit(1)}"
  setup:
    image: powershell
    commands:
      - node scripts/ci-local.mjs --stage=setup
  desktop:
    image: powershell
    commands:
      - pnpm --filter @openaxe/desktop package
  plugin:
    image: powershell
    commands:
      - node scripts/ci-local.mjs --stage=plugin --skip-setup --with-sdks
      # CLAP is EXCLUDE_FROM_ALL — build it explicitly so the zip ships
      # OpenAxe.vst3 + OpenAxe.clap (AU is macOS-only).
      - cmake --build packages/vst3/build --config Release --target openaxe_clap -j
      - node scripts/collect-plugin-bundles.mjs --platform=windows
  upload:
    image: powershell
    secrets: [r2_access_key, r2_secret_key, r2_account_id]
    environment:
      R2_PUBLIC_URL: https://pub-800f414cbfe9422e9faaa00ed34d2821.r2.dev
    commands:
      - node scripts/r2-upload.mjs "apps/desktop/build/openaxe-desktop-*.zip" "packages/vst3/build/openaxe-plugin-bundles-*.zip"
