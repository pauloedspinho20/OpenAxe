# Release (macOS leg) — SKELETON, Phase 3 completes when R2 tokens land.
# Tag push v* → tag==VERSION guard → CPack dmg + plugin bundles → rclone to R2.
# The Linux/Windows legs (release-linux.yml, release-win.yml) mirror this file
# with their own artifacts; release-publish.yml (mac agent) polls R2 for all
# three legs, then writes sha256sums.txt + manifest.json and triggers Pages.
# NOTE: `image` selects the shell for the Local backend (bash/sh/zsh/pwsh/…).

labels:
  platform: darwin/arm64

when:
  - event: tag
    ref: refs/tags/v*

steps:
  guard:
    image: bash
    commands:
      - node -e "var t=(process.env.CI_COMMIT_TAG||'').replace(/^v/,'');var v=require('fs').readFileSync('VERSION','utf8').trim();if(t!==v){console.error('tag '+process.env.CI_COMMIT_TAG+' != VERSION '+v);process.exit(1)}"
  package:
    image: bash
    commands:
      - 'echo "TODO Phase 3: CPack dmg + universal VST3/CLAP/AU (see apps/desktop + packages/vst3)"'
  upload:
    image: bash
    secrets: [r2_access_key, r2_secret_key, r2_account_id]
    commands:
      - 'echo "TODO Phase 3: node scripts/r2-upload.mjs (needs R2 secrets above)"'
