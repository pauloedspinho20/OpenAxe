# Release (macOS leg) — tag push v* → guard → dmg + plugin bundles → R2.
# NOTE: `image` selects the shell for the Local backend (bash/sh/zsh/pwsh/…).
# Secrets (r2_*) are Woodpecker user secrets; R2_PUBLIC_URL is public by design.

labels:
  platform: darwin/arm64

when:
  # Tag pushes build the release; `manual` lets a missed tag (e.g. the server
  # wasn't running at tag time) be replayed from the Woodpecker UI (issue #441).
  - event: [tag, manual]

steps:
  guard:
    image: bash
    commands:
      # Manual runs have no CI_COMMIT_TAG — fall back to VERSION so the guard
      # passes and the artifacts are stamped from the checkout.
      - node -e "var v=require('fs').readFileSync('VERSION','utf8').trim();var t=(process.env.CI_COMMIT_TAG||('v'+v)).replace(/^v/,'');if(t!==v){console.error('tag '+t+' != VERSION '+v);process.exit(1)}"
  setup:
    image: bash
    commands:
      - node scripts/ci-local.mjs --stage=setup
  desktop:
    image: bash
    commands:
      - pnpm --filter @openaxe/desktop package
  plugin:
    image: bash
    commands:
      - node scripts/ci-local.mjs --stage=plugin --skip-setup --with-sdks
      # AU and CLAP are EXCLUDE_FROM_ALL — build them explicitly so the zip
      # holds the real .component/.clap bundles, not just the default VST3.
      # (matches .github/workflows/plugin.yml's AU/CLAP step)
      - cmake --build packages/vst3/build --config Release --target openaxe_au openaxe_clap -j
      - node scripts/collect-plugin-bundles.mjs --platform=macos
  upload:
    image: bash
    secrets: [r2_access_key, r2_secret_key, r2_account_id]
    environment:
      R2_PUBLIC_URL: https://pub-800f414cbfe9422e9faaa00ed34d2821.r2.dev
    commands:
      - node scripts/r2-upload.mjs "apps/desktop/build/openaxe-desktop-*.dmg" "packages/vst3/build/openaxe-plugin-bundles-*.zip"
