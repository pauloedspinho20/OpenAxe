# Release (macOS leg) — tag push v* → guard → dmg + plugin bundles → R2.
# NOTE: `image` selects the shell for the Local backend (bash/sh/zsh/pwsh/…).
# Secrets (r2_*) are Woodpecker user secrets; R2_PUBLIC_URL is public by design.

labels:
  platform: darwin/arm64

when:
  - event: tag
    ref: refs/tags/v*

steps:
  guard:
    image: bash
    commands:
      - node -e "var t=(process.env.CI_COMMIT_TAG||'').replace(/^v/,'');var v=require('fs').readFileSync('VERSION','utf8').trim();if(t!==v){console.error('tag '+process.env.CI_COMMIT_TAG+' != VERSION '+v);process.exit(1)}"
  setup:
    image: bash
    commands:
      - node scripts/ci-local.mjs --stage=setup
  desktop:
    image: bash
    commands:
      - pnpm --filter @openaxe/desktop package
  plugin:
    image: bash
    commands:
      - node scripts/ci-local.mjs --stage=plugin --skip-setup
      # AU bundle is EXCLUDE_FROM_ALL — build it so the zip holds the real
      # component, not the plist-only stub the default build stages.
      - cmake --build packages/vst3/build --config Release --target openaxe_au -j
      - node scripts/collect-plugin-bundles.mjs --platform=macos
  upload:
    image: bash
    secrets: [r2_access_key, r2_secret_key, r2_account_id]
    environment:
      R2_PUBLIC_URL: https://pub-800f414cbfe9422e9faaa00ed34d2821.r2.dev
    commands:
      - node scripts/r2-upload.mjs "apps/desktop/build/openaxe-desktop-*.dmg" "packages/vst3/build/openaxe-plugin-bundles-*.zip"
