# Builds the landing on every change to it, so a broken landing fails before
# the merge, and attaches the built site to PRs as a preview artifact.
#
# It does not deploy. The live site (openaxe-site.pages.dev) is Cloudflare
# Pages, shipped by release.yml's `landing` job against the fresh R2
# manifest. This workflow used to also deploy to GitHub Pages, which is not
# enabled on the repo, so that job failed on every push to main.
name: Pages — landing

on:
  push:
    branches: [main, dev]
    paths:
      - 'apps/landing/**'
      - 'packages/ui/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/landing/**'
      - 'packages/ui/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-js

      - name: Fetch releases (best-effort)
        run: pnpm --filter @openaxe/landing fetch:releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Build landing
        run: pnpm --filter @openaxe/landing build

      # PR preview as plain artifact (not Pages)
      - name: Upload preview artifact (PR only)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: landing-preview-${{ github.sha }}
          path: apps/landing/dist
          if-no-files-found: error
