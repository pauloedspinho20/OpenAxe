name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # packages/core's own C++ suite - 33 tests covering the DSP, the graph, the
  # ABI and the state document. Until issue #315 this ran only on developers'
  # machines: ci.yml tested the web app and plugin.yml tested packages/vst3, so
  # nothing in CI exercised the engine's own tests. That is the job the
  # golden-audio regression harness needs, since its whole purpose is to fail a
  # PR that changes how an effect sounds.
  #
  # Separate from build-and-test because it needs the C++ toolchain and the DSP
  # submodules, which the web job has no use for.
  core-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config

      - name: Configure
        run: cmake -S packages/core -B packages/core/build -DCMAKE_BUILD_TYPE=Release -DOPENAXE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build packages/core/build -j

      # --output-on-failure so a golden-metric drift prints the offending
      # effect/stimulus/metric and both values straight into the CI log; the
      # harness is written so that output alone is enough to judge the change.
      - name: Test
        run: ctest --test-dir packages/core/build --output-on-failure -j2

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Param schema drift check
        run: node scripts/gen-param-schema.mjs --check

      # Covered by the plain --check above too (no --target means every
      # target), kept explicit so the plugin-side artifact fails loudly on its
      # own (issue #121).
      - name: Plugin automation map drift check
        run: node scripts/gen-param-schema.mjs --check --target=automation-map

      - name: Effects config drift check
        # Covered by the plain --check above too; explicit so a stale
        # enabled_blocks.h / block_sources.cmake / generatedBlockConfig.ts
        # names packages/core/effects.config.json in the failure (issue #313).
        run: node scripts/gen-param-schema.mjs --check --target=effects

      - name: Grid dimensions drift check
        run: node scripts/check-grid-dims.mjs

      - name: WASM exports drift check
        run: node scripts/check-wasm-exports.mjs

      - name: Version sync check
        run: node scripts/sync-version.mjs --check

      - name: Design tokens drift check
        run: node packages/ui/scripts/generate-tokens.mjs --check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # `pnpm build` covers the web app + packages/ui and deliberately excludes
      # @openaxe/desktop (use `pnpm build:desktop` / `build:all` for that): the
      # desktop build shells out to a full native CMake/webview compile (Linux
      # needs WebKitGTK + GTK dev packages this runner doesn't have, plus
      # packages/core's git submodules checked out - neither of which this job
      # is provisioned for). That's exactly what the dedicated Desktop Build
      # workflow (desktop.yml) already covers across all three OSes.
      - name: Typecheck & build
        run: pnpm build

      - name: Test
        run: pnpm test:run

      - name: Install Playwright browsers
        run: pnpm --filter @openaxe/web exec playwright install --with-deps chromium firefox webkit

      - name: E2E test
        run: pnpm test:e2e

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Cloudflare Pages preview — https://openaxe.pages.dev
  # NOTE: Deploys via cloudflare/pages-action@v1 are handled by Cloudflare's
  # GitHub integration for PR previews. The direct-push deploy below is
  # disabled on feature branches to avoid 0s-parse failures on forks and to
  # keep CI focused on build/test — re-enable after validating workflow syntax
  # on main/dev (see 5b1a87e / 0d88546).
