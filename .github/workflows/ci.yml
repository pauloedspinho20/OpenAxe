name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Param schema drift check
        run: node scripts/gen-param-schema.mjs --check

      # Covered by the plain --check above too (no --target means every
      # target), kept explicit so the plugin-side artifact fails loudly on its
      # own (issue #121).
      - name: Plugin automation map drift check
        run: node scripts/gen-param-schema.mjs --check --target=automation-map

      - name: Grid dimensions drift check
        run: node scripts/check-grid-dims.mjs

      - name: WASM exports drift check
        run: node scripts/check-wasm-exports.mjs

      - name: Version sync check
        run: node scripts/sync-version.mjs --check

      - name: Design tokens drift check
        run: node packages/ui/scripts/generate-tokens.mjs --check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # `pnpm build` covers the web app + packages/ui and deliberately excludes
      # @openaxe/desktop (use `pnpm build:desktop` / `build:all` for that): the
      # desktop build shells out to a full native CMake/webview compile (Linux
      # needs WebKitGTK + GTK dev packages this runner doesn't have, plus
      # packages/core's git submodules checked out - neither of which this job
      # is provisioned for). That's exactly what the dedicated Desktop Build
      # workflow (desktop.yml) already covers across all three OSes.
      - name: Typecheck & build
        run: pnpm build

      - name: Test
        run: pnpm test:run

      - name: Install Playwright browsers
        run: pnpm --filter @openaxe/web exec playwright install --with-deps chromium firefox webkit

      - name: E2E test
        run: pnpm test:e2e

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Cloudflare Pages preview — https://openaxe.pages.dev
  # Deploys the Vite SPA (apps/web/dist) to Cloudflare Pages on every push to
  # main/dev. Preview deployments for PRs are handled automatically by the
  # Cloudflare GitHub integration; this job covers direct pushes and ensures
  # the dist is built with the same pnpm/frozen-lockfile pipeline as CI.
  # Uses cloudflare/pages-action@v1 (Wrangler-based). Requires repo secrets:
  #   CLOUDFLARE_API_TOKEN (Pages:Edit) and CLOUDFLARE_ACCOUNT_ID.
  # Project name `openaxe` → https://openaxe.pages.dev (production = main,
  # branch `dev` → https://dev.openaxe.pages.dev). If secrets are missing the
  # job is skipped gracefully.
  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        if: secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: openaxe
          directory: apps/web/dist
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
