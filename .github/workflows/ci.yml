name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Param schema drift check
        run: node scripts/gen-param-schema.mjs --check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # @nam/desktop is deliberately excluded: its build shells out to a full
      # native CMake/webview compile (Linux needs WebKitGTK + GTK dev
      # packages this runner doesn't have, plus packages/core's git
      # submodules checked out - neither of which this job is provisioned
      # for). That's exactly what the dedicated Desktop Build workflow
      # (desktop.yml) already covers correctly across all three OSes.
      - name: Typecheck & build
        run: pnpm turbo run build --filter='!@nam/desktop'

      - name: Test
        run: pnpm test:run

      - name: Install Playwright browsers
        run: pnpm --filter @nam/web exec playwright install --with-deps chromium firefox webkit

      - name: E2E test
        run: pnpm test:e2e

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
