name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'apps/landing/**'
      - 'storybook-static/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/auto-release.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # packages/core's own C++ suite - 33 tests covering the DSP, the graph, the
  # ABI and the state document. Until issue #315 this ran only on developers'
  # machines: ci.yml tested the web app and plugin.yml tested packages/vst3, so
  # nothing in CI exercised the engine's own tests. That is the job the
  # golden-audio regression harness needs, since its whole purpose is to fail a
  # PR that changes how an effect sounds.
  #
  # Separate from build-and-test because it needs the C++ toolchain and the DSP
  # submodules, which the web job has no use for.
  core-tests:
    # Draft PRs pay nothing: reviewers mark ready-for-review when CI signal
    # is actually wanted (issue #379). Skipped checks never satisfy branch
    # protection, which is correct — drafts can't merge anyway.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-core-${{ runner.os }}-${{ hashFiles('packages/core/CMakeLists.txt', 'packages/core/src/**', 'packages/core/include/**', 'packages/core/tests/**') }}
          restore-keys: |
            ccache-core-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache cmake ninja-build pkg-config
          ccache --set-config=max_size=400M
          ccache -z

      - name: Configure
        run: cmake -S packages/core -B packages/core/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOPENAXE_BUILD_TESTS=ON -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build packages/core/build -j

      - name: ccache stats (pre-test)
        run: ccache -s

      # --output-on-failure so a golden-metric drift prints the offending
      # effect/stimulus/metric and both values straight into the CI log; the
      # harness is written so that output alone is enough to judge the change.
      - name: Test
        run: ctest --test-dir packages/core/build --output-on-failure -j2

      - name: ccache stats (post)
        if: always()
        run: ccache -s

  # Fast drift/lint/format/typecheck+build — fails in <2 min without needing
  # browsers or the full test suite. Split from unit/e2e so these run in
  # parallel and a prettier typo doesn't wait for Playwright (47s+100s).
  checks:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-js

      - name: Param schema drift check
        run: node scripts/gen-param-schema.mjs --check

      # Covered by the plain --check above too (no --target means every
      # target), kept explicit so the plugin-side artifact fails loudly on its
      # own (issue #121).
      - name: Plugin automation map drift check
        run: node scripts/gen-param-schema.mjs --check --target=automation-map

      - name: Effects config drift check
        # Covered by the plain --check above too; explicit so a stale
        # enabled_blocks.h / block_sources.cmake / generatedBlockConfig.ts
        # names packages/core/effects.config.json in the failure (issue #313).
        run: node scripts/gen-param-schema.mjs --check --target=effects

      - name: Grid dimensions drift check
        run: node scripts/check-grid-dims.mjs

      - name: WASM exports drift check
        run: node scripts/check-wasm-exports.mjs

      - name: Version sync check
        run: node scripts/sync-version.mjs --check

      - name: Design tokens drift check
        run: node packages/ui/scripts/generate-tokens.mjs --check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # `pnpm build` covers the web app + packages/ui and deliberately excludes
      # @openaxe/desktop (use `pnpm build:desktop` / `build:all` for that): the
      # desktop build shells out to a full native CMake/webview compile (Linux
      # needs WebKitGTK + GTK dev packages this runner doesn't have, plus
      # packages/core's git submodules checked out - neither of which this job
      # is provisioned for). That's exactly what the dedicated Desktop Build
      # workflow (desktop.yml) already covers across all three OSes.
      - name: Typecheck & build
        run: pnpm build

      # Built once here, downloaded by e2e below instead of a second
      # `pnpm build` (issue #379, plan option C). Artifacts can't cross
      # workflows, so the native workflows still build the UI once each on
      # their own runners — the macOS ×10 saving there comes from the
      # Linux-only PR legs (desktop.yml / plugin.yml), not from sharing.
      - name: Upload web dist (shared with e2e)
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 2

  unit:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-js

      - name: Test
        run: pnpm test:run

  e2e:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-js

      - name: Download web dist (built once in checks)
        uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-chromium-1.62.1
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @openaxe/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @openaxe/web exec playwright install-deps chromium

      - name: E2E test
        # Full 4-project matrix (chromium/firefox/webkit + mobile) is ~3× slower.
        # Keep PR feedback fast: only chromium (-mobile) here; main/dev retain
        # full coverage via workflow_dispatch or a nightly job. Restore full
        # `pnpm test:e2e` when cross-browser signal is worth the 25m install.
        run: pnpm --filter @openaxe/web exec playwright test --project=chromium-desktop --project=chromium-mobile

      - name: Build Storybook
        # Extended split (issue #379, plan option B): Storybook is a build
        # check, not PR signal — it runs on merge to main/dev, where a
        # failure still blocks the release flow without taxing every push.
        if: github.event_name != 'pull_request'
        run: pnpm build-storybook

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Cloudflare Pages preview — https://openaxe.pages.dev
  # NOTE: Deploys via cloudflare/pages-action@v1 are handled by Cloudflare's
  # GitHub integration for PR previews. The direct-push deploy below is
  # disabled on feature branches to avoid 0s-parse failures on forks and to
  # keep CI focused on build/test — re-enable after validating workflow syntax
  # on main/dev (see 5b1a87e / 0d88546).
