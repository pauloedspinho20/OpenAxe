# Release — tag `v*` → 3-OS build → Cloudflare R2 → manifest → landing deploy.
#
# This is the whole release path. It replaces the split introduced in #441/#427
# (cheap versioning on Actions, heavy builds on a self-hosted Woodpecker): on a
# PUBLIC repo, standard GitHub-hosted runners are free and unmetered on all
# three OSes, so the cost argument that motivated the split no longer holds and
# the local-only dependency — releases could only be cut while a Mac, three
# agents and a smee forwarder were up — is gone with it.
#
# Flow:
#   dev → main → auto-release.yml bumps VERSION + tags vX.Y.Z
#              → THIS workflow: guard → build ×3 → R2 → publish → landing
#
# All the real work lives in plain Node under scripts/, exactly as it did for
# Woodpecker, so the pipelines stayed interchangeable and this file is mostly a
# translation of the former .woodpecker/release-*.yml pipelines (now deleted).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0) — must already exist'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Public by design — it is the download host printed in the release notes.
  R2_PUBLIC_URL: https://pub-800f414cbfe9422e9faaa00ed34d2821.r2.dev
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The tag and the VERSION file must agree, or the manifest advertises a
  # version the installers don't carry. Cheap, and fails before any build.
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Tag matches VERSION
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(cat VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $RELEASE_TAG does not match VERSION $version"
            exit 1
          fi
          echo "tag $RELEASE_TAG matches VERSION $version"

  build:
    needs: guard
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows moves from the UTM Win11 **ARM** agent to a hosted **x64**
          # runner. That is the architecture nearly every Windows user wants;
          # the ARM VM was an artefact of the host Mac, not a target choice.
          # macos-15 is arm64, as macos-14 resolved to. GitHub retired the
          # macos-14 image on 2026-11-02; a retired label cancels the job in
          # ~1s with zero steps and only an annotation ('The configuration
          # ...-default is not supported'), so it reads as flaky infra.
          # Pinned, not macos-latest: that is macOS 26 + a new Xcode, which
          # is not something to discover during a release.
          - os: macos-15
            leg: macos
            installer: 'apps/desktop/build/openaxe-desktop-*.dmg'
          - os: windows-latest
            leg: windows
            installer: 'apps/desktop/build/openaxe-desktop-*.zip'
          - os: ubuntu-24.04
            leg: linux
            installer: 'apps/desktop/build/openaxe-desktop-*.deb'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
            C:/ccache
          key: ccache-release-${{ matrix.os }}-${{ hashFiles('packages/core/CMakeLists.txt', 'apps/desktop/CMakeLists.txt', 'packages/core/src/**', 'apps/desktop/src/**') }}
          restore-keys: |
            ccache-release-${{ matrix.os }}-
            ccache-desktop-${{ matrix.os }}-

      # rclone is the R2 client scripts/r2-upload.mjs shells out to. It was
      # baked into the ci-linux image and installed by hand on the mac/win
      # agents; hosted runners ship without it.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache cmake ninja-build pkg-config zip rclone \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libasound2-dev libpulse-dev \
            libcurl4-openssl-dev
          ccache --set-config=max_size=400M 2>/dev/null || true

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache rclone 2>/dev/null || true
          ccache --set-config=max_size=400M 2>/dev/null || true

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache rclone -y --no-progress
          ccache --set-config=max_size=400M 2>$null

      - uses: ./.github/actions/setup-js

      - name: Package desktop app
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
        run: pnpm --filter @openaxe/desktop package

      # macOS/Windows fetch the iPlug2 VST3/CLAP SDKs and build the
      # EXCLUDE_FROM_ALL AU/CLAP targets explicitly, so the zip holds real
      # bundles rather than just the default VST3.
      - name: Build plugin bundles (macOS)
        if: runner.os == 'macOS'
        run: |
          node scripts/ci-local.mjs --stage=plugin --skip-setup --with-sdks
          cmake --build packages/vst3/build --config Release --target openaxe_au openaxe_clap -j
          node scripts/collect-plugin-bundles.mjs --platform=macos --tag="$RELEASE_TAG"

      - name: Build plugin bundles (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/ci-local.mjs --stage=plugin --skip-setup --with-sdks
          cmake --build packages/vst3/build --config Release --target openaxe_clap -j
          node scripts/collect-plugin-bundles.mjs --platform=windows --tag="$RELEASE_TAG"

      # Linux builds the plugin headless (no IGraphics backend, SDKs not
      # fetched), so no GUI bundles exist — --allow-empty keeps that from
      # failing the release. The .deb is the Linux artifact.
      - name: Build plugin bundles (Linux)
        if: runner.os == 'Linux'
        run: |
          node scripts/ci-local.mjs --stage=plugin --skip-setup
          node scripts/collect-plugin-bundles.mjs --platform=linux --tag="$RELEASE_TAG" --allow-empty

      # Linux ships the .deb alone — its plugin build is headless, so there is
      # no bundle zip to upload and r2-upload.mjs would (correctly) fail on a
      # glob that matches nothing.
      - name: Upload to R2 (installer + plugin bundles)
        if: runner.os != 'Linux'
        shell: bash
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          node scripts/r2-upload.mjs --tag="$RELEASE_TAG" \
            "${{ matrix.installer }}" \
            "packages/vst3/build/openaxe-plugin-bundles-*.zip"

      - name: Upload to R2 (installer only)
        if: runner.os == 'Linux'
        shell: bash
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/r2-upload.mjs --tag="$RELEASE_TAG" "${{ matrix.installer }}"

      # Also kept as workflow artifacts so the publish job can attach them to a
      # GitHub Release — on a public repo the Releases tab is where people
      # actually look for downloads, and it costs nothing to mirror there.
      - name: Stash artifacts for the GitHub Release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.leg }}
          path: |
            apps/desktop/build/openaxe-desktop-*
            packages/vst3/build/openaxe-plugin-bundles-*.zip
          if-no-files-found: warn
          retention-days: 7

  # Polls R2 until every leg has landed, writes sha256sums.txt and the root
  # manifest.json the landing (and the in-app update check) read, then mirrors
  # the same artifacts onto a GitHub Release.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rclone

      - uses: ./.github/actions/setup-js

      # Windows joins --expect here: it was excluded only because the UTM agent
      # was not live (#427 Phase 4). A hosted runner always is.
      - name: Write sha256sums + manifest on R2
        env:
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: node scripts/r2-publish.mjs --tag="$RELEASE_TAG" --expect=macos,linux,windows

      - name: Download built artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist-release
          merge-multiple: true

      - name: Mirror to a GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="Downloads and checksums: ${R2_PUBLIC_URL}/${RELEASE_TAG}/

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed."
          # find -type f, never dist-release/*. upload-artifact roots each
          # artifact at the least common ancestor of the files it matched.
          # While only apps/desktop/build/openaxe-desktop-* existed, that
          # ancestor was apps/desktop/build and the download was flat. Now the
          # plugin bundles under packages/vst3/build match too, so the ancestor
          # is the repo root and dist-release holds apps/ and packages/ TREES.
          # The glob then handed `gh release` a directory, and v0.4.1 died with
          #   read dist-release/packages: is a directory
          # after the release had already been created. Listing real files is
          # also layout-proof: it keeps working whatever matches in future.
          assets=()
          while IFS= read -r f; do assets+=("$f"); done < <(find dist-release -type f)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "::error::nothing under dist-release to mirror — the build legs stashed no artifacts"
            exit 1
          fi
          printf 'asset: %s\n' "${assets[@]}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --title "$RELEASE_TAG" --notes "$notes"
          fi

  # Rebuilds the landing against the freshly written R2 manifest and ships it,
  # so the releases page and the app's update check see the new version.
  landing:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: ./.github/actions/setup-js

      - name: Build landing against R2
        env:
          RELEASES_SOURCE: r2
        run: pnpm --filter @openaxe/landing build

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        # --branch is REQUIRED here. Without it wrangler infers the branch
        # from git, and this job checks out a TAG — a detached HEAD — so
        # wrangler reported the branch as "head" and Cloudflare filed every
        # release as a PREVIEW:
        #   Deployment alias URL: https://head.openaxe-site.pages.dev
        # Production only updates from the project's production branch, so the
        # landing job has never actually shipped a release to the live site.
        # v0.4.1 went out with openaxe-site.pages.dev still advertising 0.2.8.
        #
        # Pinned to main: Cloudflare takes a Git-integration project's
        # production branch from the repo default, which is main. If the
        # project is ever reconfigured, change this to match — a mismatch is
        # silent, and shows up only as the live site not moving.
        run: npx wrangler pages deploy apps/landing/dist --project-name=openaxe-site --branch=main --commit-dirty=true
