# Plugin CI — VST3 / CLAP / AUv2 (issue #136, extends #54 release flow).
# Three formats × three platforms is nine artifacts, and macOS additionally
# needs universal binaries + notarization.
#
# Every event runs the full 3-OS matrix. The Linux-only PR leg, the `full-ci`
# label and the weekly backstop existed only because Actions minutes were
# billed on a private repo (issue #379); standard runners are free and
# unmetered on public repos. PRs build and test on all three OSes; packaging,
# signing and artifact upload still run only where something ships.
name: Plugin Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main, dev]
    paths:
      - packages/vst3/**
      - packages/core/**
      - packages/ui/tokens/**
      - .github/workflows/plugin.yml

concurrency:
  group: plugin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  plugin:
    # Drafts aren't ready for review and can't merge, so don't run on them.
    if: github.event.pull_request.draft != true
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        include:
          # macos-15 is arm64, as macos-14 resolved to. GitHub retired the
          # macos-14 image on 2026-11-02; a retired label cancels the job in
          # ~1s with zero steps and only an annotation ('The configuration
          # ...-default is not supported'), so it reads as flaky infra.
          # Pinned, not macos-latest: that is macOS 26 + a new Xcode, which
          # is not something to discover during a release.
          - os: macos-15
            cmake_preset: Release
            artifact_glob: packages/vst3/build/*.vst3
            extra_artifacts: packages/vst3/build/*.component packages/vst3/build/*.clap
            cpack_generator: productbuild
          - os: windows-latest
            cmake_preset: Release
            artifact_glob: packages/vst3/build/**/*.vst3
            extra_artifacts: packages/vst3/build/**/*.clap
            cpack_generator: WIX
          - os: ubuntu-24.04
            cmake_preset: Release
            artifact_glob: packages/vst3/build/*.vst3
            extra_artifacts: packages/vst3/build/*.clap
            cpack_generator: DEB
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
            C:/ccache
          key: ccache-plugin-${{ matrix.os }}-${{ matrix.cmake_preset }}-${{ hashFiles('packages/vst3/CMakeLists.txt', 'packages/core/CMakeLists.txt', 'packages/vst3/src/**', 'packages/core/src/**') }}
          restore-keys: |
            ccache-plugin-${{ matrix.os }}-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache cmake ninja-build pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libasound2-dev libpulse-dev \
            libcurl4-openssl-dev
          ccache --set-config=max_size=600M 2>/dev/null || true
          ccache -z 2>/dev/null || true

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache 2>/dev/null || true
          ccache --set-config=max_size=600M 2>/dev/null || true
          ccache -z 2>/dev/null || true

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache -y --no-progress 2>$null || Write-Host "ccache not installed via choco, continuing"
          ccache --set-config=max_size=600M 2>$null || true
          ccache -z 2>$null || true

      - uses: ./.github/actions/setup-js

      - name: Build web UI (for plugin webview)
        run: pnpm build

      - name: Cache iPlug2 SDKs
        uses: actions/cache@v6
        with:
          path: |
            packages/vst3/build/_deps/iplug2-src/Dependencies
          key: iplug2-sdks-${{ hashFiles('packages/vst3/CMakeLists.txt') }}
          restore-keys: |
            iplug2-sdks-

      - name: Verify tag matches VERSION (for tag pushes)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(cat VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag v$tag_version does not match VERSION file ($file_version) — bump VERSION (node scripts/sync-version.mjs) and re-tag"
            exit 1
          fi

      - name: Configure plugin (Release, universal on macOS)
        shell: bash
        run: |
          extra_args=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            extra_args='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          fi
          cmake -S packages/vst3 -B packages/vst3/build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_preset }} $extra_args -DOPENAXE_BUILD_TESTS=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

      # iPlug2 ships only SDK *placeholders* (Dependencies/IPlug/VST3_SDK holds a
      # README), so the configure above creates no VST3/CLAP targets at all —
      # packages/vst3/CMakeLists.txt gates them on VST3_SDK_AVAILABLE. Without
      # this step "Build plugin" compiled no plugin whatsoever and still
      # reported success, which is exactly how the Windows CRT link error
      # reached the tagged v0.4.0 release. Same fetch-then-reconfigure the
      # release legs get via `ci-local.mjs --with-sdks`.
      # Not on Linux: iPlug2 has no Linux support at all — its own SDK script
      # prints "Error - Linux not yet supported", and IPlugTimer.h hits
      # `#error NOT IMPLEMENTED`. release.yml makes the same exclusion
      # ("Linux builds the plugin headless ... SDKs not fetched"). Linux was
      # only ever green here because the absent SDK hid that wall by accident;
      # this makes the exclusion deliberate.
      - name: Fetch iPlug2 SDKs and reconfigure
        if: runner.os != 'Linux'
        shell: bash
        run: |
          deps=packages/vst3/build/_deps/iplug2-src/Dependencies/IPlug
          if [ ! -d "$deps" ]; then
            echo "::error::iPlug2 source missing — the configure step did not fetch it"
            exit 1
          fi
          if [ ! -f "$deps/VST3_SDK/pluginterfaces/vst/ivstaudioprocessor.h" ]; then
            (cd "$deps" && bash download-vst3-sdk.sh)
          fi
          if [ ! -f "$deps/CLAP_SDK/include/clap/clap.h" ]; then
            (cd "$deps" && bash download-clap-sdks.sh)
          fi
          extra_args=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            extra_args='-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64'
          fi
          cmake -S packages/vst3 -B packages/vst3/build -DCMAKE_BUILD_TYPE=${{ matrix.cmake_preset }} $extra_args -DOPENAXE_BUILD_TESTS=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache

      - name: Build plugin
        run: cmake --build packages/vst3/build --config ${{ matrix.cmake_preset }} -j

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s 2>/dev/null || true

      - name: Build AU/CLAP bundles (explicit targets, when SDK present)
        shell: bash
        run: |
          cmake --build packages/vst3/build --config ${{ matrix.cmake_preset }} --target openaxe_clap 2>/dev/null || echo "::notice::CLAP target not available (SDK missing)"
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake --build packages/vst3/build --config ${{ matrix.cmake_preset }} --target openaxe_au 2>/dev/null || echo "::notice::AU target not available (SDK missing)"
          fi

      # The guard this job was missing. Everything above tolerates a missing
      # SDK with a ::notice::, so a configure that produced no plugin targets
      # sailed through as a green "plugin" check — the merge gate reported a
      # plugin build while building no plugin. Fail loudly instead.
      #
      # macOS/Windows only: on Linux the plugin is built headless and produces
      # no GUI bundles by design, which is why collect-plugin-bundles.mjs is
      # invoked there with --allow-empty.
      - name: Assert the plugin binary actually exists
        if: runner.os != 'Linux'
        shell: bash
        run: |
          # find, not `shopt -s globstar`: the macOS runner's /bin/bash is 3.2,
          # which has no globstar, and `shell: bash` runs with -e, so the shopt
          # alone killed this step while the build itself was fine. Note .vst3
          # and .component are bundle DIRECTORIES on macOS — find matches those
          # as readily as files, which a -type f test would not.
          found=$(find packages/vst3/build \( -name '*.vst3' -o -name '*.clap' -o -name '*.component' \) -print)
          if [ -z "$found" ]; then
            echo "::error::No .vst3/.clap/.component was produced — the plugin targets were skipped (SDK missing?). This job must not pass without building the plugin."
            exit 1
          fi
          echo "$found" | sed 's/^/built: /'

      # Everything except the host validators, selected by label rather than a
      # name regex. The regex here used to be
      #   -R "smoke|latency|suspend|realtime|editor|primitives|grid|midi"
      # which silently skipped param_surface, state, asset, ui_serving and
      # monitor_tap: a new test simply never ran in CI unless someone
      # remembered to extend the pattern. -LE cannot miss one (issue #300).
      - name: Plugin tests (no host)
        run: ctest --test-dir packages/vst3/build -C ${{ matrix.cmake_preset }} --output-on-failure -LE validator

      # The validators need real host tooling (pluginval, auval, the VST3
      # validator, clap-validator) and each SKIPs cleanly when its tool is
      # absent, which on a bare runner is all of them — hence `|| true`. That
      # also means a genuine validator failure cannot fail this job today; the
      # cost of installing pluginval in CI is tracked separately in #130.
      - name: Plugin validators (when the tools are present)
        run: ctest --test-dir packages/vst3/build -C ${{ matrix.cmake_preset }} --output-on-failure -L validator || true

      # ── Signing (only when secrets are present, otherwise builds unsigned) ──

      - name: macOS — Import Developer ID certificate
        if: runner.os == 'macOS' && env.APPLE_DEVELOPER_ID_CERTIFICATE_P12 != ''
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 }}
          APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_DEVELOPER_ID_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: macOS — Codesign bundles
        if: runner.os == 'macOS' && env.APPLE_DEVELOPER_ID_CERTIFICATE_P12 != ''
        env:
          APPLE_DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_P12 }}
        run: |
          for bundle in packages/vst3/build/*.vst3 packages/vst3/build/*.component packages/vst3/build/*.clap; do
            [ -e "$bundle" ] || continue
            echo "Signing $bundle"
            codesign --force --options runtime --sign "Developer ID Application" --timestamp "$bundle" || echo "::warning::codesign failed for $bundle (missing certificate?)"
          done

      - name: macOS — Notarize and staple
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for bundle in packages/vst3/build/*.vst3 packages/vst3/build/*.component packages/vst3/build/*.clap; do
            [ -e "$bundle" ] || continue
            ditto -c -k --keepParent "$bundle" "/tmp/$(basename "$bundle").zip"
            echo "Notarizing $(basename "$bundle").zip"
            xcrun notarytool submit "/tmp/$(basename "$bundle").zip" --apple-id "$APPLE_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait || echo "::warning::notarization failed for $bundle"
            xcrun stapler staple "$bundle" || echo "::warning::stapler failed for $bundle"
          done

      - name: Windows — Authenticode signing
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_P12 != ''
        env:
          WINDOWS_CERTIFICATE_P12: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$env:WINDOWS_CERTIFICATE_P12" | Out-File -Encoding ascii -FilePath /tmp/certificate.p12
          # Decoding base64 and signing via signtool — placeholder, requires hardware token or AzureSignTool in real setup
          Write-Host "Authenticode signing would run here (signtool sign /f /tmp/certificate.p12 /p $env:WINDOWS_CERTIFICATE_PASSWORD packages/vst3/build/**/*.vst3)"
          Write-Host "::warning::Windows signing is stubbed — configure signtool with your certificate"

      # ── Installers / packaging — full runs only (issue #379). The PR leg
      # proves compile+tests; CPack, bundle zips and uploads ride the runs
      # that can actually ship (push / tag / dispatch).

      - name: Package plugin (CPack)
        if: github.event_name != 'pull_request'
        # CPack for plugin is defined in packages/vst3/CMakeLists.txt
        # generators: productbuild (macOS .pkg → /Library/Audio/Plug-Ins/*),
        # WIX (Windows .msi → Program Files\Common Files\VST3), DEB+TGZ (Linux)
        # Fail loudly — bundle completeness is required for a shippable Release (#292).
        # NOTE: cpack config is packages/vst3/build/CPackConfig.cmake from repo root;
        # do NOT use working-directory with a full path (see #292 fix — double-prefix broke CI).
        shell: bash
        run: |
          set -e
          if [ "${{ matrix.cpack_generator }}" = "productbuild" ]; then
            # macOS .pkg — installs to standard Audio Plug-Ins locations
            if ! cpack --config packages/vst3/build/CPackConfig.cmake -G productbuild; then
              echo "::warning::productbuild failed, falling back to ZIP (still requires bundles present)"
              cpack --config packages/vst3/build/CPackConfig.cmake -G ZIP
            fi
          elif [ "${{ matrix.cpack_generator }}" = "WIX" ]; then
            if ! cpack --config packages/vst3/build/CPackConfig.cmake -G WIX; then
              echo "::warning::WIX failed, falling back to ZIP"
              cpack --config packages/vst3/build/CPackConfig.cmake -G ZIP
            fi
          else
            cpack --config packages/vst3/build/CPackConfig.cmake -G "${{ matrix.cpack_generator }};TGZ"
          fi
          ls -lh packages/vst3/build/*.pkg packages/vst3/build/*.msi packages/vst3/build/*.deb packages/vst3/build/*.zip packages/vst3/build/*.tar.gz 2>/dev/null || true

      - name: Create fallback artifacts (debug build-tree + bundles zip)
        if: github.event_name != 'pull_request' && always()
        shell: bash
        continue-on-error: true
        run: |
          ref="${{ github.ref_name }}"
          safe_ref="${ref//\//-}"
          # Debug: full build tree (CI triage only — NOT an installable plugin, see issue #292)
          tar -czf "openaxe-plugin-build-tree-${{ matrix.os }}-${safe_ref}.tar.gz" -C packages/vst3/build --exclude="_deps" --exclude="CMakeFiles" . 2>/dev/null || true
          # User-facing: bundles only (what hosts actually scan) — always produced even if CPack failed
          # Windows multi-config puts bundles under build/Release or build/**/*.vst3, so handle both flat and nested layouts.
          shopt -s globstar nullglob 2>/dev/null || true
          bundles=(packages/vst3/build/*.vst3 packages/vst3/build/**/*.vst3 packages/vst3/build/*.component packages/vst3/build/**/*.component packages/vst3/build/*.clap packages/vst3/build/**/*.clap)
          existing=()
          for b in "${bundles[@]}"; do [ -e "$b" ] && existing+=("$b"); done
          if [ ${#existing[@]} -gt 0 ]; then
            zip -r "openaxe-plugin-bundles-${{ matrix.os }}-${safe_ref}.zip" "${existing[@]}" 2>/dev/null || \
              cmake -E tar cf "openaxe-plugin-bundles-${{ matrix.os }}-${safe_ref}.zip" --format=zip -- "${existing[@]}" 2>/dev/null || true
          else
            echo "::notice::No bundles found for ${{ matrix.os }} — VST3/CLAP/AU targets may have been skipped (SDK missing?)"
          fi
          ls -lh openaxe-plugin-build-tree-* openaxe-plugin-bundles-* 2>/dev/null || ls -lh packages/vst3/build/*.vst3 packages/vst3/build/**/*.vst3 packages/vst3/build/*.component packages/vst3/build/*.clap 2>/dev/null || true

      - name: Upload VST3 artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: openaxe-plugin-${{ matrix.os }}-vst3
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: warn

      - name: Upload extra artifacts (CLAP/AU on macOS)
        if: github.event_name != 'pull_request' && matrix.extra_artifacts != ''
        uses: actions/upload-artifact@v7
        with:
          name: openaxe-plugin-${{ matrix.os }}-extra
          path: ${{ matrix.extra_artifacts }}
          if-no-files-found: warn

      - name: Upload installers
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: openaxe-plugin-${{ matrix.os }}-installers
          path: |
            packages/vst3/build/*.pkg
            packages/vst3/build/*.dmg
            packages/vst3/build/*.deb
            packages/vst3/build/*.msi
            packages/vst3/build/*.tar.gz
            packages/vst3/build/*.zip
            openaxe-plugin-bundles-*.zip
          if-no-files-found: warn

      - name: Upload debug build-tree (CI triage only — not installable, see #292)
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v7
        with:
          name: openaxe-plugin-${{ matrix.os }}-debug-build-tree
          path: openaxe-plugin-build-tree-*.tar.gz
          if-no-files-found: warn

      # The GitHub Release for a tag is owned by release.yml, which builds the
      # shipping plugin bundles itself, uploads them to R2 and mirrors them on
      # the Release. Publishing here too would race it — both workflows fire on
      # the same `v*` tag, and whichever lost would clobber the other's notes.
