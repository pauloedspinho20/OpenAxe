# Fully automatic versioning: on every push to main, derive the next semver
# from conventional commits since the last v* tag, bump VERSION,
# sync package.json files, update CHANGELOG.md, commit + tag and push.
# Pushing the tag then triggers the existing Desktop Release workflow
# (release.yml) which builds and publishes installers — no manual steps.
#
# Flow:
#   PR → dev → PR dev→main → merge to main → this workflow → vX.Y.Z tag → release.yml
#                                                          └→ back-merge main → dev
#
# The release commit is created here, on main, and nowhere else. Without the
# back-merge dev keeps the previous VERSION, every branch cut from dev carries
# it, and the next dev→main PR reads as a version downgrade (issue #304).
#
# Requires a PAT that can bypass branch protection on main:
#   1. Create a classic PAT (https://github.com/settings/tokens) with `repo` scope
#      as pauloedspinho20, or a fine-grained PAT with Contents:write on this repo.
#   2. Add it as repo secret `RELEASE_PAT` (Settings → Secrets → Actions → New secret).
#   3. Ruleset protect-main-dev already has Bypass → pauloedspinho20 → Always,
#      so pushes authenticated as you bypass the PR requirement.
#   If RELEASE_PAT is missing the workflow falls back to GITHUB_TOKEN and the
#   push will be rejected by branch protection (intentional — add the secret).

name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force bump type (major/minor/patch) — leave empty for auto from commits'
        required: false
        type: choice
        options: [auto, major, minor, patch]

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  bump-and-tag:
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          # Use RELEASE_PAT so the push-back is authenticated as you and bypasses
          # the ruleset (GITHUB_TOKEN is the actions bot and has no bypass on
          # user-owned repos). Falls back to GITHUB_TOKEN if secret not set.
          token: ${{ secrets.RELEASE_PAT != '' && secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace (for sync scripts)
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine bump and create release commit + tag
        id: bump
        run: |
          # If workflow_dispatch with explicit bump, do a forced bump instead of auto
          if [ "${{ inputs.bump }}" != "" ] && [ "${{ inputs.bump }}" != "auto" ]; then
            NEXT=$(node -e "
              const v=require('fs').readFileSync('VERSION','utf8').trim().split('.').map(Number);
              const bump='${{ inputs.bump }}';
              if(bump==='major'){v[0]+=1;v[1]=0;v[2]=0}else if(bump==='minor'){v[1]+=1;v[2]=0}else{v[2]+=1}
              console.log(v.join('.'))
            ")
            echo "$NEXT" > VERSION
            node scripts/sync-version.mjs
            # minimal changelog entry for forced bump
            DATE=$(date +%Y-%m-%d)
            awk -v ver="$NEXT" -v date="$DATE" '
              /## \[Unreleased\]/ { print; print ""; print "## [" ver "] - " date; print ""; print "- Manual '"${{ inputs.bump }}"' bump via workflow_dispatch"; print ""; next }1
            ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md
            git add VERSION CHANGELOG.md package.json apps/web/package.json apps/desktop/package.json apps/landing/package.json packages/ui/package.json
            git commit -m "chore(release): $NEXT"
            git tag -a "v$NEXT" -m "v$NEXT"
            echo "next=$NEXT" >> $GITHUB_OUTPUT
            echo "created=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Auto mode: let auto-bump.mjs decide from conventional commits
          node scripts/auto-bump.mjs --tag
          # Check if a tag was created (script commits + tags when bump needed)
          if git log -1 --pretty=%B | grep -q "chore(release):"; then
            NEXT=$(cat VERSION)
            echo "next=$NEXT" >> $GITHUB_OUTPUT
            echo "created=true" >> $GITHUB_OUTPUT
          else
            echo "created=false" >> $GITHUB_OUTPUT
          fi

      - name: Push commit and tag
        if: steps.bump.outputs.created == 'true'
        run: |
          NEXT="${{ steps.bump.outputs.next }}"
          echo "Pushing v$NEXT to origin..."
          git push origin main
          git push origin "v$NEXT"

      # Put the release commit back on dev straight away (issue #304). Doing it
      # here rather than by hand matters twice over:
      #
      #   * dev keeps the released VERSION, so branches cut from it are not born
      #     stale and the next dev→main PR is not a version downgrade;
      #   * the merge is trivial *now*, while the two trees are identical apart
      #     from the bump. Left until dev has moved on, the same files conflict
      #     against their own already-promoted copy — which is exactly what
      #     blocked #305 after 0.2.6 (the manual sync was skipped that round).
      #
      # A conflict here means dev and main genuinely diverged, so fail loudly
      # rather than leave the drift in place silently.
      - name: Back-merge the release into dev
        if: steps.bump.outputs.created == 'true'
        run: |
          NEXT="${{ steps.bump.outputs.next }}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/dev:refs/remotes/origin/dev
          git checkout -B dev origin/dev
          if ! git merge --no-ff origin/main -m "chore(sync): merge main v$NEXT back into dev"; then
            git merge --abort || true
            echo "::error::Back-merge of main v$NEXT into dev conflicts. Resolve by hand: git checkout dev && git merge --no-ff origin/main && git push origin dev"
            exit 1
          fi
          git push origin dev
          # Acceptance check for #304: the two branches must agree on the
          # version, not merely be mergeable.
          DEV_VERSION="$(git show dev:VERSION | tr -d '[:space:]')"
          if [ "$DEV_VERSION" != "$NEXT" ]; then
            echo "::error::dev is on VERSION $DEV_VERSION after the back-merge, expected $NEXT"
            exit 1
          fi
          echo "dev is back in sync at v$NEXT"

      - name: Summary
        run: |
          if [ "${{ steps.bump.outputs.created }}" = "true" ]; then
            echo "✅ Released v${{ steps.bump.outputs.next }} — tag pushed, Desktop Release will now build installers." >> $GITHUB_STEP_SUMMARY
            echo "✅ dev back-merged to v${{ steps.bump.outputs.next }} — branches cut from dev carry the released VERSION." >> $GITHUB_STEP_SUMMARY
          else
            echo "No version bump needed — no new commits since last tag or no relevant changes." >> $GITHUB_STEP_SUMMARY
          fi
