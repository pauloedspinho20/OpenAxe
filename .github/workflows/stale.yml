name: Stale

on:
  schedule: [{ cron: '0 0 * * 1' }] # weekly Monday
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: 'This issue has been inactive for 60 days and will be closed in 14 days. Comment or remove `stale` to keep it open.'
          stale-pr-message: 'This PR has been inactive for 60 days and will be closed in 14 days. Push or comment to keep it open.'
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'P0,epic,security'
          exempt-pr-labels: 'P0,security'
