# Unsigned dev artifacts for the native desktop app (issue #15 M4): build the
# React UI + C++ shell on each OS and upload the platform package. Signing /
# notarization is deliberately deferred - these are development artifacts.
#
# Every event runs the full 3-OS matrix. The `full-ci` label, the Linux-only
# PR leg and the weekly backstop that used to live here existed solely because
# Actions minutes were billed on a private repo at macOS ×10 (issue #379).
# Standard GitHub-hosted runners are free and unmetered on public repos, so a
# PR now gets real macOS and Windows compile coverage instead of a Linux
# approximation of it. PRs still build+link only; packaging runs on pushes,
# tags and dispatches, where the artifact is actually wanted.
name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    # Drafts aren't ready for review and can't merge, so don't run on them.
    # On non-PR events github.event.pull_request is null, and null != true.
    if: github.event.pull_request.draft != true
    strategy:
      # Fail fast on PRs (quick signal); completeness matters for the runs
      # that feed releases.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        include:
          # macos-15 is arm64, as macos-14 resolved to. GitHub retired the
          # macos-14 image on 2026-11-02; a retired label cancels the job in
          # ~1s with zero steps and only an annotation ('The configuration
          # ...-default is not supported'), so it reads as flaky infra.
          # Pinned, not macos-latest: that is macOS 26 + a new Xcode, which
          # is not something to discover during a release.
          - os: macos-15
            artifact: dmg
          - os: windows-latest
            artifact: zip
          - os: ubuntu-24.04
            artifact: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # packages/core uses git submodules for its DSP dependencies
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
            C:/ccache
          key: ccache-desktop-${{ matrix.os }}-${{ hashFiles('packages/core/CMakeLists.txt', 'apps/desktop/CMakeLists.txt', 'packages/core/src/**', 'apps/desktop/src/**') }}
          restore-keys: |
            ccache-desktop-${{ matrix.os }}-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache cmake ninja-build pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libasound2-dev libpulse-dev \
            libcurl4-openssl-dev
          ccache --set-config=max_size=400M 2>/dev/null || true
          ccache -z 2>/dev/null || true

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache 2>/dev/null || true
          ccache --set-config=max_size=400M 2>/dev/null || true
          ccache -z 2>/dev/null || true

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache -y --no-progress 2>$null || Write-Host "ccache not installed via choco, continuing"
          ccache --set-config=max_size=400M 2>$null || true
          ccache -z 2>$null || true

      - uses: ./.github/actions/setup-js

      # PR leg: compile + link check on all three OSes. No CPack, no uploads —
      # nothing here ships, and the push/tag runs prove packaging.
      - name: Build desktop app (PR leg)
        if: github.event_name == 'pull_request'
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
        run: pnpm --filter @openaxe/desktop build

      - name: Package desktop app
        if: github.event_name != 'pull_request'
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
        run: pnpm --filter @openaxe/desktop package

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s 2>/dev/null || true

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: openaxe-desktop-${{ matrix.os }}
          path: apps/desktop/build/openaxe-desktop-*.${{ matrix.artifact }}
          if-no-files-found: error
