# Unsigned dev artifacts for the native desktop app (issue #15 M4): build the
# React UI + C++ shell on each OS and upload the platform package. Signing /
# notarization is deliberately deferred - these are development artifacts.
name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/**'
      - 'packages/core/**'
      - 'packages/ui/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: dmg
          - os: windows-latest
            artifact: zip
          - os: ubuntu-24.04
            artifact: deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # packages/core uses git submodules for its DSP dependencies
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            ~/Library/Caches/ccache
            C:/ccache
          key: ccache-desktop-${{ matrix.os }}-${{ hashFiles('packages/core/CMakeLists.txt', 'apps/desktop/CMakeLists.txt', 'packages/core/src/**', 'apps/desktop/src/**') }}
          restore-keys: |
            ccache-desktop-${{ matrix.os }}-

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ccache cmake ninja-build pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libasound2-dev libpulse-dev \
            libcurl4-openssl-dev
          ccache --set-config=max_size=400M 2>/dev/null || true
          ccache -z 2>/dev/null || true

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ccache 2>/dev/null || true
          ccache --set-config=max_size=400M 2>/dev/null || true
          ccache -z 2>/dev/null || true

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ccache -y --no-progress 2>$null || Write-Host "ccache not installed via choco, continuing"
          ccache --set-config=max_size=400M 2>$null || true
          ccache -z 2>$null || true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CMAKE_C_COMPILER_LAUNCHER: ccache
        run: pnpm --filter @openaxe/desktop package

      - name: ccache stats
        if: always()
        shell: bash
        run: ccache -s 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: openaxe-desktop-${{ matrix.os }}
          path: apps/desktop/build/openaxe-desktop-*.${{ matrix.artifact }}
          if-no-files-found: error
