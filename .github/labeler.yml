# Area labels applied automatically to PRs by .github/workflows/labeler.yml
# (actions/labeler v5+ syntax — the bare glob lists this file used before were
# v4 and were never wired to a workflow, so nothing ever read them).
#
# Label names must exist in the repo or the action silently skips them. These
# six do: web / desktop / core / plugin mirror the package layout, and `infra`
# and `documentation` are the repo's existing labels rather than the `ci` and
# `docs` this file used to name, which never existed.

web:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/web/**'
          - 'packages/ui/**'

desktop:
  - changed-files:
      - any-glob-to-any-file:
          - 'apps/desktop/**'

core:
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/core/**'

plugin:
  - changed-files:
      - any-glob-to-any-file:
          - 'packages/vst3/**'

infra:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/workflows/**'
          - 'scripts/**'
          - 'turbo.json'
          - 'pnpm-workspace.yaml'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '**/*.md'
          - '.github/ISSUE_TEMPLATE/**'
