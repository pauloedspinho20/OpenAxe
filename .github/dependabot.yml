version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    labels: [dependencies, npm]
    target-branch: dev
  - package-ecosystem: github-actions
    directory: '/'
    schedule: { interval: weekly }
    labels: [dependencies, github-actions]
    target-branch: dev
