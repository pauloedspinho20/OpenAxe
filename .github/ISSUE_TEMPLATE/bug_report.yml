name: Bug report
description: Report a reproducible bug
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Check existing issues first, then fill the fields below.
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: 'e.g. 0.2.2 or commit SHA, and platform (web/desktop/plugin)'
      placeholder: '0.2.2, macOS 14 arm64, Chrome 126'
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      placeholder: Expected ... but got ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Console, `openaxe_desktop.log`, crash report, etc.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: I ran `pnpm lint` / `pnpm build` / drift checks if relevant
          required: false
