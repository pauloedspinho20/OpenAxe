<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="OpenAxe">
  <!--
    OpenAxe horizontal lockup (issue #151): the brand mark + wordmark.
    The word uses a system-ui stack rather than outlines so the source stays
    editable; anything that must render identically everywhere (icons,
    packaging) derives from openaxe-mark.svg instead.
  -->
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a66"/>
      <stop offset=".45" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#e03d05"/>
    </linearGradient>
  </defs>
  <g transform="translate(20 20) scale(0.3125)">
    <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#chassis)"/>
    <rect x="16" y="16" width="480" height="480" rx="102" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="4"/>
    <g transform="rotate(-12 256 256)">
      <rect x="300" y="68" width="42" height="400" rx="21" fill="#eeece6"/>
      <path d="M 292 96 C 244 92 196 96 150 108 C 134 130 124 154 124 180 C 126 212 142 244 176 268 C 214 278 254 274 292 256 L 292 96 Z" fill="url(#steel)"/>
      <path d="M 150 108 C 134 130 124 154 124 180 C 126 212 142 244 176 268 C 156 236 149 208 149 180 C 149 150 148 128 150 108 Z" fill="#ffe9dd"/>
      <rect x="348" y="108" width="34" height="136" rx="15" fill="#c23503"/>
      <rect x="292" y="84" width="56" height="184" rx="14" fill="#9c2b04"/>
    </g>
  </g>
  <text x="196" y="132" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="96" font-weight="800" letter-spacing="-2" fill="#eeece6">Open</text>
  <text x="436" y="132" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="96" font-weight="800" letter-spacing="-2" fill="#ff5a1f">Axe</text>
</svg>
