<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="OpenAxe">
  <!--
    OpenAxe brand mark (issue #151).
    Source of truth for every generated icon: favicons, PWA icons, macOS .icns,
    Windows .ico, Linux hicolor PNGs. Colors come from packages/ui design tokens
    (dark chassis #101010/#1a1a1a, accent #ff5a1f, ink1 #eeece6).
    Every shape stays inside a circle of radius ~230 about (256,256) so
    maskable variants (which crop to a circle) never clip the axe.
    Deliberately built from rects/cubics only - no arcs - so crude SVG
    rasterizers (ImageMagick MSVG, older platform decoders) stay faithful.
  -->
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9a66"/>
      <stop offset=".45" stop-color="#ff5a1f"/>
      <stop offset="1" stop-color="#e03d05"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#chassis)"/>
  <rect x="32" y="32" width="448" height="448" rx="102" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="4"/>

  <!-- axe -->
  <g transform="rotate(-12 256 256)">
    <!-- handle -->
    <rect x="300" y="68" width="42" height="400" rx="21" fill="#eeece6"/>

    <!-- blade: flares from the eye, cutting edge facing left -->
    <path d="M 292 96
             C 244 92 196 96 150 108
             C 134 130 124 154 124 180
             C 126 212 142 244 176 268
             C 214 278 254 274 292 256
             L 292 96 Z"
          fill="url(#steel)"/>

    <!-- cutting edge: bright crescent whose outer boundary is the edge itself -->
    <path d="M 150 108
             C 134 130 124 154 124 180
             C 126 212 142 244 176 268
             C 156 236 149 208 149 180
             C 149 150 148 128 150 108 Z"
          fill="#ffe9dd"/>

    <!-- poll: counterweight behind the eye -->
    <rect x="348" y="108" width="34" height="136" rx="15" fill="#c23503"/>

    <!-- collar / eye pinning head to handle -->
    <rect x="292" y="84" width="56" height="184" rx="14" fill="#9c2b04"/>
  </g>
</svg>
