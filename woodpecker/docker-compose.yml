# Woodpecker server — local-only mode (no public URL, no tunnel yet).
# Webhooks can't reach localhost, so builds trigger manually in the UI
# (http://localhost:8000). Outbound repo sync/status works behind NAT.
#
# Usage:
#   cp .env.example .env   # fill in values (never commit .env)
#   docker compose up -d
#   open http://localhost:8000  (log in via GitHub, activate pauloedspinho20/OpenAxe)

services:
  server:
    image: woodpeckerci/woodpecker-server:${WOODPECKER_VERSION:-v3.18.1}
    ports:
      - "8000:8000" # web UI
      - "9000:9000" # agent gRPC
    volumes:
      - woodpecker-data:/var/lib/woodpecker
    env_file:
      - .env
    restart: unless-stopped

volumes:
  woodpecker-data:
